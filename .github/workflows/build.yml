name: Build scrcpy Windows Client

on:
  push:
    branches:
      - 'trae/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release 标签名（如 v1.0，留空则自动生成）'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCRCPY_VERSION: '5.0.1'

jobs:
  # ==================== 编译服务端 ====================
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 编译服务端
        run: |
          # 注意：gradlew 在项目根目录
          chmod +x ./gradlew
          ./gradlew -p server assembleRelease
          ls -lh server/build/outputs/apk/release/

      - name: 上传服务端产物
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server
          path: server/build/outputs/apk/release/server-release-unsigned.apk

  # ==================== 编译 Windows 客户端 ====================
  build-windows:
    needs: build-server
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libusb
            zip

      - name: 下载服务端产物
        uses: actions/download-artifact@v4
        with:
          name: scrcpy-server
          path: server-artifact

      - name: 重命名服务端文件
        run: |
          mv server-artifact/server-release-unsigned.apk server-artifact/scrcpy-server
          ls -lh server-artifact/scrcpy-server

      - name: 配置 Meson
        run: |
          meson setup build --buildtype=release --strip \
            -Db_lto=true \
            -Dprebuilt_server=$(pwd)/server-artifact/scrcpy-server \
            -Dcompile_server=false

      - name: 编译
        run: ninja -C build

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 编译映射模板管理器
        shell: pwsh
        run: |
          cd scrcpy-mapping-manager
          dotnet publish -c Release -r win-x64 --self-contained false
          Get-ChildItem bin/Release/net8.0-windows/win-x64/publish/

      - name: 打包
        run: |
          mkdir -p dist/scrcpy-win64
          cp build/app/scrcpy.exe dist/scrcpy-win64/scrcpy.exe
          cp server-artifact/scrcpy-server dist/scrcpy-win64/scrcpy-server
          # 收集运行时需要的 MinGW DLL
          ldd build/app/scrcpy.exe | grep -E 'ucrt64|mingw64' | awk '{print $3}' | xargs -I{} cp {} dist/scrcpy-win64/ || true
          # 复制映射模板管理器
          cp -r scrcpy-mapping-manager/bin/Release/net8.0-windows/win-x64/publish/* dist/scrcpy-win64/
          # 复制模板和配置
          if [ -d templates ]; then
            cp -r templates dist/scrcpy-win64/
          fi
          if [ -f scrcpy_mapping_config.json ]; then
            cp scrcpy_mapping_config.json dist/scrcpy-win64/
          fi
          cd dist
          zip -r scrcpy-win64.zip scrcpy-win64

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/scrcpy-win64.zip

  # ==================== 创建 Release ====================
  release:
    needs: [build-server, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: artifacts

      - name: 列出文件
        run: find artifacts -type f -exec ls -lh {} \;

      - name: 生成标签名
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "scrcpy Windows Custom Build ${{ steps.tag.outputs.tag }}"
          body: |
            ## scrcpy 映射模板管理版本（Windows 64 位）

            基于 scrcpy 源码编译，集成了按键映射模板管理功能。

            ### 功能
            - **模板管理器** (`scrcpy-mapping-manager.exe`)：新建/编辑/删除模板，设置活动模板，配置快捷键
            - **JSON 模板格式**：坐标使用归一化值 (0.0~1.0)，适配任意手机分辨率
            - **热替换**：在管理器中修改或切换模板后，SCRCPY 自动重新加载
            - **设计模式**：投屏中按快捷键进入，点击屏幕记录位置，按按键绑定
            - **快速切换**：按快捷键弹出模板列表，鼠标悬停自动切换
            - **开关映射**：快捷键一键启用/关闭按键映射

            ### 默认快捷键（可在 `scrcpy_mapping_config.json` 中修改）
            - `F2`：快速切换模板
            - `F3`：进入/退出设计模式
            - `F4`：开关按键映射

            ### 使用
            1. 解压后运行 `scrcpy.exe` 投屏。
            2. 运行 `scrcpy-mapping-manager.exe` 管理模板。
            3. 模板文件位于 `templates/` 目录，活动模板记录在 `scrcpy_mapping_config.json`。

            编译时间：${{ github.event.repository.updated_at }}
          draft: false
          prerelease: false
          files: artifacts/scrcpy-win64.zip
